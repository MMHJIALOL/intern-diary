 placeRoll(G.xn,P0.x+P0.w/2,P0.y+P0.h+48);setRoll(G.xn,kAt(t,[23.7,27.0],.35));show(G.xn.m,on&&t<27.4);
 pos(G.ynW,P0.x-122,P0.y+P0.h/2+G.yn.w/2);placeRoll(G.yn,0,0);setRoll(G.yn,kAt(t,[23.7,27.0],.35));show(G.ynW,on&&t<27.4);
 placeRoll(G.yx,P0.x+P0.w+12,P0.y-18);setRoll(G.yx,kAt(t,[23.95,27.0],.35));show(G.yx.m,on&&t<27.4);
 // limit lines swing open from y = x:  v2 = v1 / (1 + dev),  dev = -10 % (upper) / +10 % (lower)

 [1/.9,1/1.1].forEach((mEnd,q)=>{const mm=lerp(1,mEnd,lp);const xa=Math.max(1.1,1.1/mm),xb=Math.min(1.4,1.4/mm);

 placeRoll(G.limL[0],vx(1.4*.9,P0),P0.y-42);placeRoll(G.limL[1],P0.x+P0.w+12,vy(1.4/1.1,P0)-18);
 G.limL.forEach(r=>{setRoll(r,kAt(t,[25.5,27.0],.35));show(r.m,t>25.3&&t<27.4);});
 // fast-path lane
 const ln=rl(LNR,pt0(MP),io(P(t,27.0,27.45))),lw=io(P(t,23.8,24.1));show(G.lane,on&&ln.w>1&&lw>0);box(G.lane,R(ln.x,ln.y,ln.w*lw,ln.h));

 show(G.fg,t>=24.9);box(G.fg,R(lerp(OX+180,OX+528,fp),lerp(-484,-384,fp),nr*CW+28,48),spr(t-24.9,2.4,.75));placeRoll(G.fgT,11,3);typeIn(G.fgT,nr,CW);
 // top N

 const tops=PTS.filter(p=>p.top).sort((p,q)=>p.top-q.top);
 G.tn.forEach((q,k)=>{const f0=26.1+.07*k,y=TY(k);
  if(q.dot){const p=tops[k-1];const a=R(vx(p.x,P0)-8,vy(p.y,P0)-8,16,16);let r=arc(a,R(OX+199,y+11,16,16),P(t,f0,f0+.45),60);r=rl(r,pt0(r,8,8),io(P(t,27.0,27.3)));show(q.dot,t>=f0&&r.w>.5);box(q.dot,r);}
  placeRoll(q.name,OX+236,y);setRoll(q.name,kAt(t,[f0+.3,27.0],.35));show(q.name.m,t>f0&&t<27.4);
  const bw=200*TOPDEV[k]/.1319*io(P(t,f0+.35,f0+.65))*(1-out);show(q.bar,bw>.5);box(q.bar,R(OX+590,y+11,bw,14));});
 placeRoll(G.tnV,OX+800,TY(0));setRoll(G.tnV,kAt(t,[26.6,27.0],.35));show(G.tnV.m,t>26.5&&t<27.4);

}
function drawPlot(t,P0){const c=G.ctx,ox=CVR.x,oy=CVR.y,sc=P0.w/700,rad=Math.max(1.2,2.7*sc);c.clearRect(0,0,CVR.w,CVR.h);

 for(const p of PTS){if(t<p.t0||!p.out)continue;if(p.top&&t>=26.1+.07*p.top)continue;const r=rad*1.15*spr(t-p.t0,3,.7),x=X0(p.x),y=Y0(p.y);

 if(t>23.95&&t<25.6){c.fillStyle='#c4c4bf';const nMax=Math.min(RATE-1,Math.floor((t-23.95)*RATE)),nMin=Math.max(0,Math.ceil((t-23.95-(L1-L0)/V)*RATE));

  if(t<td){const x=L0+(t-tn)*V-ox;c.fillStyle=COL.pgreen;c.fillRect(Math.round(x)-1,ly+8,4,32);return;}
  const q2=P(t,td,td+.35),x=lerp(xs-ox,X0(p.x),io(q2)),y=lerp(ly+24,Y0(p.y),ic(q2));c.fillStyle=COL.pgreen;c.beginPath();c.arc(x,y,lerp(2,rad*1.3,q2),0,6.2832);c.fill();});

// ================= checks =================
function hidden(e){for(let n=e;n&&n!==document.body;n=n.parentElement){const cs=getComputedStyle(n);if(cs.display==='none')return true;if(/inset\(0(px)? 100%|inset\(0(px)? 0(px)? 0(px)? 100%/.test(n.style.clipPath||''))return true;}return false;}
function audit(){const items=[];const zoomOf=e=>world.contains(e)?ZOOM:1;
 for(const r of ROLLS){if(hidden(r.m))continue;const k=r.k;if(Math.abs(k-Math.round(k))>1e-3)continue;const i=Math.round(k);const d=r.els[i];if(!d||!r.iw[i])continue;
  const rc=d.firstChild.getBoundingClientRect();items.push({rc,el:d,px:parseFloat(d.style.fontSize)*zoomOf(r.m),s:d.textContent});}
 for(const d of DIGS){if(hidden(d.e))continue;items.push({rc:d.e.getBoundingClientRect(),el:d.e,px:parseFloat(d.e.style.fontSize)*zoomOf(d.e),s:d.e.textContent.replace(/\s+/g,'').slice(0,20)});}
 for(const e of document.querySelectorAll('.pt')){if(hidden(e))continue;items.push({rc:e.getBoundingClientRect(),el:e,px:parseFloat(e.style.fontSize)*zoomOf(e),s:e.textContent});}
 if(!hidden(G.tag))items.push({rc:G.tag.getBoundingClientRect(),el:G.tag,px:28,s:'values illustrative'});
 const top=o=>{const x=clamp((o.rc.left+o.rc.right)/2,1,1918),y=clamp((o.rc.top+o.rc.bottom)/2,1,1078),h=document.elementFromPoint(x,y);return h&&(o.el.contains(h)||h.contains(o.el));};
 // text scrolled or shrunk out of an ancestor mask is not on screen
 const clipped=o=>{const cx=(o.rc.left+o.rc.right)/2,cy=(o.rc.top+o.rc.bottom)/2;for(let n=o.el.parentElement;n&&n!==document.body;n=n.parentElement){if(!n.classList||!n.classList.contains('mask'))continue;const p=n.getBoundingClientRect();if(cx<p.left||cx>p.right||cy<p.top||cy>p.bottom)return true;}return false;};
 const on=items.filter(o=>o.rc.width>1&&o.rc.right>0&&o.rc.left<1920&&o.rc.bottom>0&&o.rc.top<1080&&top(o)&&!clipped(o)),out=[];
 for(const o of on){if(o.px<27.5)out.push(`small ${o.px.toFixed(1)}px: ${o.s}`);if(o.rc.left<0||o.rc.right>1920||o.rc.top<0||o.rc.bottom>1080)out.push(`edge clip: ${o.s}`);}
 for(let i=0;i<on.length;i++)for(let j=i+1;j<on.length;j++){const a=on[i].rc,b=on[j].rc;const w=Math.min(a.right,b.right)-Math.max(a.left,b.left),h=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);
  if(w>2&&h>2)out.push(`overlap: "${on[i].s}" x "${on[j].s}"`);}
 return out;}
